# QAP Test Configuration
qap.app.name=TestApp-Demo
qap.report.fix.messaging=true
qap.user=test-user
qap.test.environment=TEST
qap.run.environment=DEV
qap.report.test.data=true
qap.api.key=demo-api-key-12345
qap.reporting.enabled=true

# ========================================
# QAP Log Capture Configuration
# ========================================
# These properties control how logs are captured during test execution
# and attached to your JSON test reports.

# Enable/disable log capture (default: true)
qap.logging.enabled=true

# Minimum log level to capture: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
# Default: DEBUG (captures everything except TRACE)
qap.logging.min.level=DEBUG

# Maximum number of log entries to capture per test (prevents OOM)
# Default: 1000
qap.logging.max.entries=100

# Maximum length of each log message in characters (longer messages are truncated)
# Default: 10000
qap.logging.max.message.length=10000

# Capture exception stack traces in logs (default: true)
qap.logging.capture.stacktraces=true

# Include MDC (Mapped Diagnostic Context) in captured logs (default: true)
qap.logging.include.mdc=true

# Include SLF4J/Log4j2 markers in captured logs (default: true)
qap.logging.include.markers=true

# Logger name patterns to capture (comma-separated, supports wildcards)
# Empty = capture all loggers (default)
# Example: com.example.*,org.springframework.web.*
qap.logging.logger.patterns=

# ========================================
# Example Configurations
# ========================================

# Capture only WARN and ERROR logs (quieter output):
# qap.logging.min.level=WARN

# Capture only your application logs:
# qap.logging.logger.patterns=com.example.testapp.*

# High-volume test logging (increase limits):
# qap.logging.max.entries=5000
# qap.logging.max.message.length=20000

# Minimal logging (disable MDC/markers for smaller JSON):
# qap.logging.include.mdc=false
# qap.logging.include.markers=false

# Optional: Git properties (can also be in git.properties)
# git.branch=main
# git.commit.id=abc123
# git.commit.time=2026-01-23T10:30:00

# ========================================
# QAP Stack Trace Configuration
# ========================================
# These properties control how exception stack traces are captured
# and formatted in failure reports.

# Maximum number of stack trace lines to include (default: 200, -1 = unlimited)
qap.stacktrace.max.lines=200

# Number of lines to keep from the start of stack trace (default: 50)
# These show the immediate error location and first frames
qap.stacktrace.head.lines=20

# Number of lines to keep from the end of stack trace (default: 20)
# These show the test runner entry point
qap.stacktrace.tail.lines=20

# Keep all frames until exiting user-code (default: false)
# If true, stops capturing when hitting framework code after user code
# This creates smaller, more focused stack traces
qap.stacktrace.keep.until.framework.exit=false

# ========================================
# Example Stack Trace Configurations
# ========================================

# Minimal stack traces (only show user code):
# qap.stacktrace.keep.until.framework.exit=true
# qap.stacktrace.max.lines=100

# Full stack traces (for deep debugging):
# qap.stacktrace.max.lines=-1

# Balanced (default - good for most cases):
# qap.stacktrace.max.lines=200
# qap.stacktrace.head.lines=50
# qap.stacktrace.tail.lines=20
